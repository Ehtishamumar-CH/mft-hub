# Version updates wait 14 days after a release (supply-chain cooldown, matches the
# pinning rule in docs/DECISIONS.md). Security updates are not delayed by cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Node 22 runtime: keep @types/node on 22.x.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript majors need ts-jest / typescript-eslint support first; upgrade deliberately.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      aws-cdk:
        patterns: ['aws-cdk', 'aws-cdk-lib', 'constructs', 'cdk-nag']
  - package-ecosystem: pip
    directory: /lambdas
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
